[tool.ruff]
target-version = "py39"
line-length = 100
src = ["."]
extend-exclude = [
    ".venv",
    ".venv-*",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
